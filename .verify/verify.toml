[verify]
commands = [
  ".verify/run.sh",
  ".verify/run.sh doctor",
  ".verify/run.sh unit",
  ".verify/run.sh static",
  ".verify/run.sh functional",
  "go test -v ./...",
  "go vet ./...",
  "go build -o .verify/output/anode ./cmd/anode",
  ".verify/output/anode inspect ./testdata/sample-shop",
  ".verify/output/anode inspect ./testdata/hyper_mesh_12",
  ".verify/output/anode dev ./testdata/sample-shop",
  ".verify/output/anode deploy root@192.168.1.100 ./testdata/hyper_mesh_12 --dry-run",
  ".verify/output/anode cluster ./testdata/hyper_mesh_12",
]

[verify.default]
command = [".verify/run.sh"]
timeout_secs = 600
hook = true
