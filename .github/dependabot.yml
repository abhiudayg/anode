version: 2
updates:
  # Maintain Go dependencies for the core Anode CLI
  - package-ecosystem: "gomod"
    directory: "/"
    exclude-paths:
      - "examples/**"
      - "testdata/**"
      - "**/testdata/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"

  # Maintain npm dependencies for the Next.js web application
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps-web)"
      include: "scope"
    labels:
      - "dependencies"
      - "web"

  # Maintain GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "ci"
      - "actions"
