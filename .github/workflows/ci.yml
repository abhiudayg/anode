name: CI - Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    name: Backend Tests & Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.22', '1.23']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Compile Anode Static Binary
        run: go build -v -ldflags="-s -w -X main.Version=dev" -o bin/anode ./cmd/anode

      - name: Verify Anode Binary
        run: ./bin/anode version

  test-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest Node 26)
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        working-directory: web
        run: bun install

      - name: Run Next.js Production Build
        working-directory: web
        run: bun run build
