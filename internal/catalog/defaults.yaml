# Anode Standard Infrastructure Driver Catalog
# Defines least-privilege security boundaries, deterministic POSIX identities, and connection templates.

drivers:
  postgres:
    kind: postgres
    category: database
    default_version: "16"
    supported_versions:
      "14":
        image: "postgres:14-alpine"
        notes: "PostgreSQL 14 LTS"
      "15":
        image: "postgres:15-alpine"
        notes: "PostgreSQL 15 LTS"
      "16":
        image: "postgres:16-alpine"
        notes: "PostgreSQL 16 LTS (Current default)"
      "17":
        image: "postgres:17-alpine"
        notes: "PostgreSQL 17 Latest"
    runtime:
      image_template: "postgres:{{.Version}}-alpine"
      data_mount: "/var/lib/postgresql/data"
      default_env:
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "postgres"
        POSTGRES_DB: "${DB_NAME}"
    security:
      uid: 999
      gid: 999
      file_mode: "0700"
      no_new_privileges: true
      drop_capabilities: ["ALL"]
      add_capabilities: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
      oom_score_adjust: -900
      cgroups:
        memory_max: "2G"
        cpu_quota: "200%"
    networking:
      primary_port: 5432
      bind_interface: "127.0.0.1"
      protocol: "postgres"
    connection_templates:
      URL: "postgres://postgres:postgres@{{.Host}}:{{.Port}}/{{.Database}}?sslmode=disable"
      HOST: "{{.Host}}"
      PORT: "{{.Port}}"
      USER: "postgres"
      PASSWORD: "postgres"
      DATABASE: "{{.Database}}"
      ADDR: "{{.Host}}:{{.Port}}"
    readiness_probe:
      command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      tcp_port: 5432
      initial_delay_sec: 2
      timeout_sec: 1

  mysql:
    kind: mysql
    category: database
    default_version: "8.4"
    supported_versions:
      "8.0":
        image: "mysql:8.0"
      "8.4":
        image: "mysql:8.4"
    runtime:
      image_template: "mysql:{{.Version}}"
      data_mount: "/var/lib/mysql"
