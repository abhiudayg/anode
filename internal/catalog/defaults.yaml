    default_version: "RELEASE.2024-05-10T01-41-38Z"
    runtime:
      image_template: "minio/minio:{{.Version}}"
      command: ["server", "/data", "--console-address", ":9001"]
      data_mount: "/data"
      default_env:
        MINIO_ROOT_USER: "minioadmin"
        MINIO_ROOT_PASSWORD: "minioadmin"
    security:
      uid: 1000
      gid: 1000
      file_mode: "0700"
      no_new_privileges: true
      oom_score_adjust: -500
      cgroups:
        memory_max: "1G"
        cpu_quota: "100%"
    networking:
      primary_port: 9000
      bind_interface: "127.0.0.1"
      protocol: "s3"
    connection_templates:
      ENDPOINT: "http://{{.Host}}:9000"
      CONSOLE_URL: "http://{{.Host}}:9001"
      ACCESS_KEY: "minioadmin"
      SECRET_KEY: "minioadmin"

  temporal:
    kind: temporal
    category: workflow_engine
    default_version: "1.23.1"
    runtime:
      image_template: "temporalio/auto-setup:{{.Version}}"
      data_mount: "/etc/temporal/schema"
      default_env:
        DB: "sqlite"
        SQLITE_DB: "/etc/temporal/schema/temporal.db"
    security:
      uid: 1000
      gid: 1000
      file_mode: "0700"
      no_new_privileges: true
      oom_score_adjust: -500
      cgroups:
        memory_max: "1G"
        cpu_quota: "100%"
    networking:
      primary_port: 7233
      bind_interface: "127.0.0.1"
      protocol: "grpc"
    connection_templates:
      HOST_PORT: "{{.Host}}:{{.Port}}"
      HOST: "{{.Host}}"
      PORT: "{{.Port}}"
